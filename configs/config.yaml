# Central configuration for the fraud detection pipeline.
# Every stage reads this file. Nothing important is hard coded in Python.
# Override any value on the command line, for example:
#   fraud train --set training.seed=7

project:
  name: fraud-detection-pipeline
  # One seed for numpy, python, scikit learn and torch. Changing it changes every result.
  seed: 42

paths:
  # All paths are relative to the repository root unless they start with a drive or a slash.
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  reports: reports
  figures: reports/figures
  tables: reports/tables

dataset:
  # Which dataset the pipeline is currently pointed at.
  # "ulb" is the Kaggle Credit Card Fraud set. "ieee" is the IEEE CIS set, added later.
  active: ulb

  ulb:
    name: Credit Card Fraud Detection (ULB)
    source_url: https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud
    # Put the downloaded file here. The ingest stage looks for it before anything else.
    raw_file: creditcard.csv
    target_column: Class
    # Column holding seconds elapsed since the first transaction in the file.
    time_column: Time
    amount_column: Amount
    # The 28 anonymised principal components.
    pca_columns_prefix: V
    pca_columns_count: 28
    expected_rows: 284807
    expected_fraud_rows: 492

ingest:
  # Parquet, not csv. It loads about ten times faster and it keeps the dtypes, so no stage
  # after this one has to guess what a column is.
  interim_file: transactions.parquet
  manifest_file: ingest_manifest.json
  # Hash the raw file and record it in the manifest, so any result can be traced back to
  # the exact input file that produced it.
  checksum: true
  # Reading in chunks keeps the peak memory low. Set to 0 to read the file in one go.
  chunk_size: 100000

split:
  # The ULB data is one continuous time window, so we split by time to avoid leaking
  # the future into the past. Fractions are of the full row count, in time order.
  strategy: time
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  # A stratified random split is kept as a comparison option.
  fallback_strategy: stratified
  # Where the split files are written, inside data/interim.
  output_dir: splits

validation:
  # Hard rules. If any of these fail the pipeline stops before training.
  max_missing_fraction: 0.0
  min_rows: 100000
  allowed_target_values: [0, 1]
  max_fraud_rate: 0.01
  min_fraud_rate: 0.0005
  amount_min: 0.0
  # The ULB file holds 1081 exact duplicate rows. They do not leak across the time split,
  # because copies share a timestamp and land in the same block, but they do let the model
  # count the same transaction twice. They are dropped and the count is reported.
  fail_on_duplicate_rows: false
  drop_duplicates: true
  # A split needs enough fraud rows for precision and recall to mean anything.
  min_fraud_rows_per_split: 30
  report_file: validation_report.md

eda:
  # Exploration runs on the training split. The test split is never read, not even to draw
  # a picture, so nothing about it can leak into a modelling decision. Drift is measured
  # against validation, which is the most recent data we are allowed to look at.
  analysis_split: train
  drift_split: validation
  figures: true
  figure_dpi: 120
  # Mutual information uses a k nearest neighbour estimator, which is slow on 200,000
  # rows. It runs on a fixed random subsample instead. Set to 0 to use every row.
  mutual_info_sample: 50000
  # The noise ceiling is found by shuffling the target and recording the best univariate
  # AUC that any feature reaches by chance. This is what makes "weak" a measured word
  # rather than a guess. See reports/tables/eda_report.md for the number it produced.
  permutation_shuffles: 40
  permutation_quantile: 0.95
  correlation_report_top: 15
  distribution_plot_features: 6
  report_file: eda_report.md
  stats_file: feature_stats.csv

feature_selection:
  enabled: true
  output_file: selected_features.json
  report_file: feature_selection.md
  # Which set the later stages use: all, safe, or selected.
  #   all       every feature, no selection at all
  #   safe      tier 1 only, the drops that are correctness problems
  #   selected  tier 1 plus tier 2, which also drops features indistinguishable from noise
  active_set: selected

  # --- Tier 1. Correctness problems. Always applied. ---
  # A feature that separates the classes this well on its own is almost certainly a leak,
  # not a discovery. Nothing in this dataset comes close, which is itself worth reporting.
  leakage_auc: 0.99
  # Two features correlated above this carry the same information. One of them goes.
  duplicate_correlation: 0.95
  # A feature where one value covers this share of rows carries almost nothing.
  dominant_value_share: 0.995
  # The share of validation values that must fall inside the training range. A feature
  # that fails this cannot generalise, because production values will sit outside
  # anything the model was fitted on. Raw Time fails it with 0.0 percent overlap.
  min_range_coverage: 0.95

  # --- Tier 2. A judgement call, not a correctness problem. ---
  # Univariate screening cannot see interactions, and tree models tolerate useless
  # features well, so this is the rule most worth arguing about. It is measured against
  # the permutation noise ceiling rather than a round number picked by hand.
  drop_low_signal: true

  # Reported, never acted on. A shifted feature can still be a useful one, and dropping
  # every feature that moved would leave very little behind.
  psi_warn: 0.25

  # Kept in the data files whatever the rules decide, because stage 3 derives features
  # from them. Being a pipeline input is not the same as being a model feature: Time is
  # dropped as a feature and kept as an input, so hour of day can be built from it.
  keep_as_input: [Time, Amount]

features:
  # Where the model ready tables are written, inside data/processed.
  output_dir: engineered
  stats_file: feature_stats_fitted.json
  report_file: feature_engineering.md

  # --- Pointwise transforms, computed from a single row ---
  amount_log: true          # log1p of the amount, because amounts are heavily skewed
  hour_of_day: true         # hour, plus a sine and cosine pair so 23:00 and 00:00 are close

  # --- History features, computed from earlier transactions only ---
  # These look backwards and never forwards, which is what makes them safe to compute
  # across the whole ordered stream. A row using earlier rows is exactly what a deployed
  # system does.
  time_since_last: true     # seconds since the previous transaction
  rolling_windows: [10, 50] # how many prior transactions each baseline covers
  amount_deviation: true    # how unusual this amount is against the recent baseline
  transaction_rate: true    # how busy the stream has been recently

  # No global standardisation happens here, on purpose.
  #
  # A z score against the training mean is a monotonic transform of the amount, so it
  # carries exactly the same information for a tree model and would show up as a perfect
  # duplicate. Linear models and the neural net do need it, so it belongs inside their own
  # pipelines in stage 4, fitted on the training fold. Putting it here would either
  # duplicate a column or quietly scale data the tree models never asked to have scaled.
  scale_pca_columns: false  # V1 to V28 are already centred by the original PCA

  # Run the selection rules again over the engineered features. The raw pass in the eda
  # stage judged the columns the file arrived with. This judges the columns the model will
  # actually see, which is the set that matters.
  reselect: true

imbalance:
  # Each model is trained under each of these settings so the results table can show
  # what imbalance handling is actually worth.
  strategies: [none, class_weight, smote]
  smote:
    sampling_strategy: 0.1   # bring the minority class up to 10 percent of the majority
    k_neighbors: 5

training:
  # Which feature sets to train on. Running all three is what turns "does feature selection
  # help" from an assumption into a row in the results table.
  feature_sets: [all, safe, selected]

  # Models are compared on validation. The test split stays closed until stage 5, so that
  # when it is finally opened it is still a genuine held out set and not somewhere every
  # decision has already been rehearsed.
  eval_split: validation

  predictions_dir: predictions
  models_dir: baselines
  save_models: true
  results_file: baseline_results.md
  results_csv: baseline_results.csv

  # A bootstrap interval on the primary metric. Validation holds 55 fraud cases, so a gap of
  # a couple of points between two models may be nothing at all, and a single number would
  # invite reading it as though it were solid.
  bootstrap_samples: 500

  # A trained model that emits fewer than this many distinct scores across the whole
  # evaluation split has effectively stopped splitting, and its metrics describe an artifact
  # rather than a model. This is a warning, not a failure, because the run is still evidence
  # about that configuration.
  #
  # The number is empirical, from this dataset. Healthy runs produced between 489 and 971
  # distinct scores. Collapsed ones produced 110 or fewer, and in the worst case 2. There is
  # a wide gap between those, and 200 sits in it.
  min_distinct_scores: 200
  bootstrap_confidence: 0.95

models:
  logistic_regression:
    enabled: true
    max_iter: 2000
    C: 1.0
    solver: liblinear
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
    n_jobs: -1
  xgboost:
    enabled: true
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist
  lightgbm:
    enabled: true
    n_estimators: 400
    num_leaves: 31
    learning_rate: 0.05
    subsample: 0.8
    # Without this, `subsample` above is silently ignored. LightGBM only bags every
    # `subsample_freq` iterations and the default is 0, meaning never. The setting was in
    # this config for a full sweep doing nothing at all: runs with and without `subsample`
    # produced byte identical scores.
    subsample_freq: 1
    colsample_bytree: 0.8
    # min_child_samples is deliberately left at its default of 20.
    #
    # Lowering it to 10 was tried, to stop the unweighted runs collapsing. It did stop that,
    # and it destroyed the two runs that already worked: LightGBM with class weights fell from
    # 0.857 to 0.014 and started emitting three distinct scores across the whole split. The
    # combination of a small leaf floor and a class weight of 540 is what breaks it, and
    # testing the two separately hid that.
    #
    # The unweighted collapse is not a bug to tune away. It is the finding: LightGBM needs
    # imbalance handling on this data, where random forest merely benefits from it. The
    # collapse detector reports those runs rather than hiding them.
  neural_net:
    enabled: true
    hidden_sizes: [64, 32]
    dropout: 0.3
    learning_rate: 0.001
    batch_size: 512
    epochs: 30
    early_stopping_patience: 5

evaluation:
  # Accuracy is deliberately absent. On a 0.17 percent positive rate it is meaningless.
  primary_metric: average_precision   # this is PR AUC
  report_metrics: [precision, recall, f1, average_precision, roc_auc, brier_score]
  # The operating threshold is picked on validation, then applied unchanged to test.
  threshold_strategy: cost            # options: cost, max_f1, fixed_recall
  fixed_recall_target: 0.80

  # Which run gets promoted. "auto" takes the healthy run with the lowest validation cost.
  # A run name like "lightgbm__smote__all" pins it instead.
  champion: auto
  test_split: test
  report_file: evaluation.md
  summary_file: evaluation_summary.json

  cost:
    # How a missed fraud is charged.
    #
    #   flat    every missed fraud costs false_negative_cost below
    #   amount  a missed fraud costs the value of that transaction
    #
    # These are different objectives, not different precisions about the same one. Flat
    # optimises for catching fraud *cases*, amount optimises for recovering *money*, and
    # the fraudulent amounts here are severely skewed: median 12.31, mean 120.29, max
    # 2125.87. A quarter of frauds are 1.00 or less and sixteen are exactly zero.
    #
    # They do not disagree on every model. Where they do, on LightGBM and random forest
    # with SMOTE, the amount model gives up about three fraud cases to remove between seven
    # and sixteen false alarms, and the fraudulent value recovered is unchanged to three
    # decimal places. On models whose scores are strongly bimodal they pick the same
    # threshold. See the build log.
    model: amount

    # Used only when model is flat. Checked against the data: the mean fraudulent amount in
    # the training split is 120.29, so this is the right flat number. It is still the wrong
    # summary, which is why amount is the default.
    false_negative_cost: 120.0

    # NOT derivable from this dataset. It is the support and churn expense of wrongly
    # blocking a customer, which is a business input. The sweep below reports what the
    # threshold would be across a range instead of pretending this number is measured.
    false_positive_cost: 5.0
    sensitivity_false_positive_costs: [1.0, 2.0, 5.0, 10.0, 25.0, 50.0]

explainability:
  shap_enabled: true
  shap_background_samples: 200
  shap_top_features: 10

registry:
  # MLflow tracking. A local sqlite store by default, so nothing external is needed.
  enabled: true
  tracking_uri: sqlite:///mlflow.db
  experiment_name: fraud-detection
  registered_model_name: fraud-detector
  # A challenger is promoted to champion only if it beats the champion by this much.
  promotion_metric: average_precision
  promotion_min_improvement: 0.005

serving:
  api_host: 0.0.0.0
  api_port: 8000
  streamlit_port: 8501
  # The app calls the API at this address. Docker compose overrides it with the service name.
  api_base_url: http://localhost:8000
