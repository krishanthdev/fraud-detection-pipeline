name: CI

# Every pull request into develop or main has to pass this before it can merge.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  # The CPU build of torch. The default wheel pulls the whole CUDA stack, which is
  # gigabytes of download that a test runner has no use for.
  TORCH_CPU_INDEX: https://download.pytorch.org/whl/cpu

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.8.4

      - name: Ruff check
        run: ruff check src tests app

      - name: Ruff format check
        run: ruff format --check src tests app

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install the CPU build of torch first
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url ${{ env.TORCH_CPU_INDEX }}

      - name: Install the project
        run: |
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run tests
        # The dataset is not in the repository, so tests that need it are skipped here.
        run: pytest -m "not needs_data" --cov=fraud_pipeline --cov-report=xml --cov-report=term-missing

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
