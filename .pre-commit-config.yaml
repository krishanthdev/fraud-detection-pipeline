# Local checks that run before every commit, so CI rarely fails on something trivial.
# Install once with:  pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "develop"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

# nbstripout is deliberately absent.
#
# It was here, and it was wrong for this repository. Stripping notebook outputs is the right
# default on a shared engineering repo, where outputs bloat the history and make diffs
# unreadable. This is a portfolio repo, where the notebook is something a reader opens on
# GitHub and reads in ten seconds. Stripped, it renders as a page of empty cells.
#
# The usual cost does not apply here either. The figures are written to reports/figures and
# the notebook prints their paths, so nothing large is embedded. The outputs are text tables,
# the file is around 30 KB, and the diffs stay readable.
#
# The tradeoff taken instead: outputs can go stale. Re-run the notebook before committing a
# change to it. See CONTRIBUTING.md.
